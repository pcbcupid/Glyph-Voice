<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750" role="img" aria-labelledby="title desc"><title id="title">GLYPH VOICE kit wiring</title><desc id="desc">Glyph C6 to I2S microphone module: GPIO16 L/R, GPIO17 WS, GPIO22 SCK, GPIO23 SD, shared ground and compatible 3.3 volt supply.</desc><rect width="1100" height="750" fill="#f7f9fc"/><style>text{font-family:Arial,sans-serif;fill:#152437}.title{font-size:32px;font-weight:bold}.sub{font-size:19px}.pin{font-size:21px;font-weight:bold}.note{font-size:18px}</style><text x="55" y="62" class="title">GLYPH VOICE · kit wiring</text><text x="55" y="94" class="sub">Connection diagram • firmware transport-r6 • ESP32-C6</text><rect x="60" y="140" width="310" height="390" rx="22" fill="white" stroke="#263d54" stroke-width="3"/><rect x="730" y="140" width="310" height="390" rx="22" fill="white" stroke="#263d54" stroke-width="3"/><text x="85" y="183" class="pin">PCB Cupid GLYPH C6</text><text x="755" y="183" class="pin">I2S microphone module</text><text x="95" y="242" class="pin">3V3</text><circle cx="370" cy="235" r="5" fill="#e34d59"/><path d="M370 235 H730" stroke="#e34d59" stroke-width="4"/><circle cx="730" cy="235" r="5" fill="#e34d59"/><text x="765" y="242" class="pin">VCC *</text><text x="95" y="291" class="pin">GND</text><circle cx="370" cy="284" r="5" fill="#4e5e73"/><path d="M370 284 H730" stroke="#4e5e73" stroke-width="4"/><circle cx="730" cy="284" r="5" fill="#4e5e73"/><text x="765" y="291" class="pin">GND</text><text x="95" y="340" class="pin">GPIO16</text><circle cx="370" cy="333" r="5" fill="#915ad5"/><path d="M370 333 H730" stroke="#915ad5" stroke-width="4"/><circle cx="730" cy="333" r="5" fill="#915ad5"/><text x="765" y="340" class="pin">L/R</text><text x="95" y="389" class="pin">GPIO17</text><circle cx="370" cy="382" r="5" fill="#e19a20"/><path d="M370 382 H730" stroke="#e19a20" stroke-width="4"/><circle cx="730" cy="382" r="5" fill="#e19a20"/><text x="765" y="389" class="pin">WS / LRCLK</text><text x="95" y="438" class="pin">GPIO22</text><circle cx="370" cy="431" r="5" fill="#168ea4"/><path d="M370 431 H730" stroke="#168ea4" stroke-width="4"/><circle cx="730" cy="431" r="5" fill="#168ea4"/><text x="765" y="438" class="pin">SCK / BCLK</text><text x="95" y="487" class="pin">GPIO23</text><circle cx="370" cy="480" r="5" fill="#279858"/><path d="M370 480 H730" stroke="#279858" stroke-width="4"/><circle cx="730" cy="480" r="5" fill="#279858"/><text x="765" y="487" class="pin">SD / DOUT</text><text x="70" y="570" class="note">BOOT: onboard GPIO9 button → start / stop recording. Power the C6 through USB.</text><text x="70" y="604" class="note">* Connect 3V3 only if the module’s VCC rating supports 3.3 V. Verify its label/datasheet.</text><text x="70" y="636" class="note">3.3 V logic. L/R held LOW by GPIO16 selects the left I2S slot. Keep wires short.</text><text x="70" y="668" class="note">Do not drive GPIO pins with 5 V. Disconnect power before changing connections.</text><text x="70" y="712" class="note">Logical wiring, not physical pin placement. Use the GLYPH C6 pinout to locate pins.</text></svg>