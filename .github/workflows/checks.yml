name: Software checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  local-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest server.test_server -v
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Java host regression tests
        run: ./gradlew :core:test
      - name: Firmware host regression tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror firmware/tests/PcmDecimatorTest.cpp -o /tmp/glyph-decimator-test
          /tmp/glyph-decimator-test
          c++ -std=c++17 -Wall -Wextra -Werror firmware/tests/StopCommandTest.cpp -o /tmp/glyph-stop-test
          /tmp/glyph-stop-test
          c++ -std=c++17 -Wall -Wextra -Werror firmware/tests/ProvisioningFrameTest.cpp -o /tmp/glyph-provisioning-test
          /tmp/glyph-provisioning-test
