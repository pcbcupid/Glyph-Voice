plugins { id 'com.android.application' }
android {
    namespace 'com.pcbcupid.voice'
    compileSdk 36
    defaultConfig {
        applicationId 'com.pcbcupid.voice'
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName '0.11.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // The high-accuracy model needs a 64-bit address space.
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    androidResources { noCompress += 'zip' }
    if (project.hasProperty('voiceFixtures')) {
        sourceSets.androidTest.assets.srcDir layout.buildDirectory.dir('generated/voice-fixtures')
    }
}
if (project.hasProperty('voiceFixtures')) {
    tasks.register('prepareVoiceFixtures', Sync) {
        from(project.property('voiceFixtures')) { include 'test.wav' }
        into layout.buildDirectory.dir('generated/voice-fixtures')
    }
    tasks.configureEach {
        if (name.contains('AndroidTest')) dependsOn 'prepareVoiceFixtures'
    }
}
dependencies {
    implementation project(':core')
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation files('libs/sherpa-onnx-1.13.8.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
